name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Download NLTK punkt
        run: python -m nltk.downloader punkt punkt_tab

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy sumlens tests scripts

      - name: Tests + coverage gate
        run: pytest -q --cov=sumlens --cov-report=term-missing --cov-fail-under=70
