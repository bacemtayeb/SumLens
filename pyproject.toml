[project]
name = "sumlens"
version = "0.1.0"
description = "Explainability dashboard for AI-generated summaries"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pdfplumber",
    "nltk",
    "transformers>=4.40,<5",  # 5.x removed the "summarization" pipeline task
    "torch",
    "lettucedetect",
    "inseq",
    "numpy",
    "gradio",
    "matplotlib",
    "scikit-learn",
    "fpdf2",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sumlens*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "nltk", "nltk.*",
    "transformers", "transformers.*",
    "torch", "torch.*",
    "lettucedetect", "lettucedetect.*",
    "inseq", "inseq.*",
    "numpy", "numpy.*",
    "gradio", "gradio.*",
    "matplotlib", "matplotlib.*",
    "sklearn", "sklearn.*",
    "fpdf", "fpdf.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
